<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Oeee Cafe</title>
    <style>
      /* NEO's ground, as the site's own (static/ds.css in oeee-cafe/web) and
         the window's background colour (main.rs), so the hand-over from this
         page to the site does not change the screen: lavender by day, NEO's
         night blue by night, with the painter's 14px grid over it. */
      :root {
        --ground: #ccccff;
        --grid: #bbbbff;
        --ink: #22223a;
        --muted: #4a4a78;
        --accent: #c4ee62;
        --accent-hover: #b5e24c;
        --accent-ink: #1c2811;
        --accent-line: rgba(60, 103, 18, 0.35);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #17172b;
          --grid: #22223f;
          --ink: #dcdcea;
          --muted: #a3a3bd;
        }
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: var(--ground);
        background-image: linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 14px 14px;
        color: var(--ink);
        font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI",
          "Apple SD Gothic Neo", "Malgun Gothic", "Hiragino Sans", "Yu Gothic UI", system-ui,
          sans-serif;
        text-align: center;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      /* Where the site's toolbar will be: the handle the window is dragged
         by while there is no toolbar yet, since the window has no title bar
         of its own on Windows. */
      .titlebar {
        position: fixed;
        top: 0;
        right: 0;
        left: 0;
        height: 52px;
      }
      /* The mark and the name, as the site's toolbar starts. */
      .brand {
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 20px;
      }
      .brand img {
        width: 36px;
        height: 36px;
      }
      .brand span {
        margin-left: 10px;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: -0.01em;
      }
      /* The site's spinner: a cucumber turning. */
      .spinner {
        display: inline-block;
        font-family: "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
        font-size: 24px;
        line-height: 1;
        animation: spin 1.1s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .spinner {
          animation: none;
        }
      }
      p {
        margin: 8px 0;
      }
      .muted {
        color: var(--muted);
      }
      .title {
        font-size: 16px;
        font-weight: 600;
      }
      /* The site's primary button. */
      button {
        margin-top: 12px;
        padding: 4px 14px;
        border: 1px solid var(--accent-line);
        border-radius: 6px;
        background: var(--accent);
        color: var(--accent-ink);
        font: inherit;
        font-size: 13px;
        font-weight: 600;
        line-height: 20px;
        cursor: default;
      }
      button:hover {
        background: var(--accent-hover);
      }
      [hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="titlebar" data-tauri-drag-region></div>
    <main>
      <div class="brand">
        <img src="mark.png" alt="" draggable="false" />
        <span id="brand-name">Oeee Cafe</span>
      </div>
      <div id="connecting">
        <span class="spinner" id="connecting-spinner" role="status">🥒</span>
      </div>
      <div id="offline" hidden>
        <p id="offline-title" class="title"></p>
        <p id="offline-body" class="muted"></p>
        <button id="retry" type="button"></button>
      </div>
    </main>
    <script>
      // The app opens here, not on the site: a site that cannot be reached
      // would otherwise leave the webview's own error page on screen, which
      // differs on every platform and offers no way to try again.
      var WORDS = {
        en: {
          name: "Oeee Cafe",
          connecting: "Connecting to Oeee Cafe…",
          title: "Oeee Cafe can't be reached.",
          body: "Check your internet connection and try again.",
          retry: "Try again",
        },
        ko: {
          name: "오이카페",
          connecting: "오이카페에 연결하는 중…",
          title: "오이카페에 연결할 수 없습니다.",
          body: "인터넷 연결을 확인한 뒤 다시 시도해 주세요.",
          retry: "다시 시도",
        },
        ja: {
          name: "OEEEカフェ",
          connecting: "OEEEカフェに接続しています…",
          title: "OEEEカフェに接続できません。",
          body: "インターネット接続を確認して、もう一度お試しください。",
          retry: "再試行",
        },
        zh: {
          name: "黄瓜咖啡馆",
          connecting: "正在连接黄瓜咖啡馆…",
          title: "无法连接黄瓜咖啡馆。",
          body: "请检查网络连接后重试。",
          retry: "重试",
        },
      };
      var language = (navigator.language || "en").slice(0, 2);
      var words = WORDS[language] || WORDS.en;

      // The spinner is the whole of it on screen; the words are for a
      // screen reader, not the eye.
      document.getElementById("connecting-spinner").setAttribute("aria-label", words.connecting);
      document.getElementById("brand-name").textContent = words.name;
      document.getElementById("offline-title").textContent = words.title;
      document.getElementById("offline-body").textContent = words.body;
      document.getElementById("retry").textContent = words.retry;

      var site =
        new URLSearchParams(location.search).get("site") || "https://oeee.cafe/";

      function connect() {
        document.getElementById("connecting").hidden = false;
        document.getElementById("offline").hidden = true;
        // `no-cors` resolves on any answer from the server and rejects only
        // when nothing answered, which is exactly the question here.
        fetch(site, { mode: "no-cors", cache: "no-store" })
          .then(function () {
            location.replace(site);
          })
          .catch(function () {
            document.getElementById("connecting").hidden = true;
            document.getElementById("offline").hidden = false;
          });
      }

      document.getElementById("retry").addEventListener("click", connect);
      window.addEventListener("online", connect);
      connect();
    </script>
  </body>
</html>
