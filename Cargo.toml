[package]
name = "oeee-cafe-desktop"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/oeee-cafe/desktop"
description = "Oeee Cafe for Steam: a window onto oeee.cafe"

# Steam: signing in, rich presence, and Steam's library beside the binary,
# which the app then cannot start without. A build for the Microsoft Store
# leaves it out with `--no-default-features`.
[features]
default = ["steam"]
steam = ["dep:steamworks"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The window comes back where it was left, and a second launch brings the
# open window forward instead of starting another app.
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
sys-locale = "0.3"
url = "2"
steamworks = { version = "0.13.1", optional = true, features = ["raw-bindings"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# What tauri-plugin-dialog shows its dialogs with, without the plugin: it
# replaces `window.confirm` in every page, the site's included, with one that
# returns a Promise, and htmx reads a Promise as yes.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }

# The same versions wry uses, for the WebView2 settings Tauri does not expose.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = "0.61"

# The same versions wry uses, so these are the classes it built its webview
# from rather than a second copy of them.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKUIDelegate", "objc2-app-kit"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
