[package]
name = "oeee-cafe-desktop"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/oeee-cafe/desktop"
description = "Oeee Cafe for Steam: a window onto oeee.cafe"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
sys-locale = "0.3"
url = "2"

# What tauri-plugin-dialog shows its dialogs with, without the plugin: it
# replaces `window.confirm` in every page, the site's included, with one that
# returns a Promise, and htmx reads a Promise as yes.
[target.'cfg(not(target_os = "macos"))'.dependencies]
rfd = { version = "0.16", default-features = false, features = ["gtk3", "common-controls-v6"] }

# The same versions wry uses, so these are the classes it built its webview
# from rather than a second copy of them.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSAlert", "NSApplication", "NSResponder", "NSRunningApplication"] }
objc2-foundation = { version = "0.3", features = ["NSString"] }
objc2-web-kit = { version = "0.3", features = ["WKWebView", "WKUIDelegate", "objc2-app-kit"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
