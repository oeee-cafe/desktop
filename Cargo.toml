[package]
name = "oeee-cafe-desktop"
version = "0.1.0"
edition = "2021"
publish = false
description = "Oeee Cafe for Steam: a window onto oeee.cafe"

# Its own workspace, so the server's `cargo` commands never build a GUI and
# this never inherits the server's lockfile or `debug = true` release profile.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
