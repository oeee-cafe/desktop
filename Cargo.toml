[package]
name = "oeee-cafe-desktop"
version = "0.1.0"
edition = "2021"
publish = false
license = "AGPL-3.0-only"
repository = "https://github.com/oeee-cafe/desktop"
description = "Oeee Cafe for the desktop, on Steam and the Microsoft Store: a window onto oeee.cafe"

# Steam: signing in, rich presence, the Supporter Pack's price, and Steam's
# library beside the binary, which the app then cannot start without. A
# build for the Microsoft Store leaves it out with `--no-default-features`.
[features]
default = ["steam"]
steam = ["dep:steamworks", "dep:ureq"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# The window comes back where it was left, and a second launch brings the
# open window forward instead of starting another app.
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# Coming back from a sign-in done in the browser: the site sends it to
# oeee-cafe://handoff/done, which Steam's build registers with Windows
# through this (handoff.rs). The URL itself arrives as a second launch.
tauri-plugin-deep-link = "2"
url = "2"
steamworks = { version = "0.13.1", optional = true, features = ["raw-bindings"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }

# What tauri-plugin-dialog shows its dialogs with, without the plugin: it
# replaces `window.confirm` in every page, the site's included, with one that
# returns a Promise, and htmx reads a Promise as yes.
rfd = { version = "0.16", default-features = false, features = ["common-controls-v6"] }

# The same versions wry uses, for the WebView2 settings Tauri does not expose,
# the window that stands in for the toolbar's maximise button (snap.rs), and
# in the Microsoft Store's build the Store itself (microsoft.rs).
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
# Asks Steam's public store API what a DLC costs (steam.rs); Steamworks
# itself has no way to say. On Windows over the system's own TLS, trusting
# what Windows trusts, as Edge does.
ureq = { version = "3", optional = true, default-features = false, features = ["native-tls", "gzip"] }
# The lists the Store's calls take, which `windows` does not re-export.
windows-collections = "0.2"
windows = { version = "0.61", features = [
  "Foundation_Collections",
  "Services_Store",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Packaging_Appx",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

# Elsewhere -- a developer's build on macOS, since only Windows ships -- over
# rustls, ureq's own default.
[target.'cfg(not(windows))'.dependencies]
ureq = { version = "3", optional = true }

[profile.release]
codegen-units = 1
lto = true
strip = true
